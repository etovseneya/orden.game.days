<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Календарь игр</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    /* ВСЕ ВАШИ СТИЛИ */
    * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
    body { background: #e8e0d0; padding: 12px; min-height: 100vh; }
    .container { max-width: 100%; margin: 0 auto; background: #f5f0e8; border-radius: 24px; padding: 16px; border: 1px solid #d4c9b0; }
    h1 { font-size: 1.6rem; color: #4a5b3a; text-align: center; margin-bottom: 8px; }
    .mode-badge { display: inline-block; background: #e0d8c8; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; color: #4a5b3a; }
    .status-bar { background: #e8e0d0; padding: 5px 10px; border-radius: 12px; margin: 8px 0; font-size: 0.7rem; text-align: center; color: #5a6b4a; }
    .admin-panel { background: #e0d8c0; padding: 10px; border-radius: 14px; margin: 12px 0; display: none; }
    .admin-panel.show { display: block; }
    .admin-toggle { background: #8a7a5a; color: white; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; }
    .month-nav { display: flex; justify-content: space-between; align-items: center; margin: 16px 0; }
    .month-nav button { background: #d0c8b0; border: none; padding: 8px 16px; border-radius: 30px; cursor: pointer; font-size: 1rem; }
    .current-month { font-weight: bold; font-size: 1.2rem; background: #e8e0d0; padding: 6px 16px; border-radius: 30px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .weekday { text-align: center; padding: 8px 2px; background: #d8d0c0; border-radius: 12px; font-size: 0.7rem; font-weight: 600; }
    .day-cell { border-radius: 12px; min-height: 85px; padding: 5px 3px; cursor: pointer; border: 1px solid #d0c8b0; background: #faf8f0; position: relative; overflow-y: auto; }
    .day-cell.has-event { background: #e8a0a0 !important; border: 2px solid #c04040 !important; }
    .viking-icon { position: absolute; top: 2px; right: 2px; font-size: 0.9rem; }
    .day-number { font-weight: bold; font-size: 0.8rem; width: 26px; text-align: center; border-radius: 30px; padding: 2px 0; }
    .event-badge { background: #8a9e6a; color: white; border-radius: 8px; padding: 2px 4px; font-size: 0.55rem; margin: 2px 0; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vote-info { font-size: 0.55rem; background: rgba(0,0,0,0.1); border-radius: 8px; padding: 2px; text-align: center; margin-top: 2px; }
    .empty-day { text-align: center; margin-top: 25px; font-size: 0.65rem; color: #b0a890; }
    .details-section { background: #f0ece0; border-radius: 20px; padding: 16px; margin-top: 16px; }
    .event-title { font-size: 1.2rem; font-weight: bold; color: #4a5b3a; }
    .event-desc { color: #6a7b5a; font-size: 0.85rem; padding-bottom: 8px; border-bottom: 1px solid #d0c8b0; margin-bottom: 12px; }
    .vote-buttons { display: flex; gap: 15px; justify-content: center; margin: 12px 0; }
    .vote-btn { border: none; border-radius: 30px; padding: 6px 20px; font-size: 0.8rem; cursor: pointer; background: #e8e4d8; border: 1px solid #c0b8a0; }
    .vote-btn.yes { background: #d0e8c0; }
    .vote-btn.no { background: #e8c0c0; }
    .vote-btn.disabled { opacity: 0.5; cursor: not-allowed; }
    .vote-columns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
    .vote-col { flex: 1; background: #faf8f0; border-radius: 14px; padding: 8px; }
    .vote-col.green { background: #d0e8c0; }
    .vote-col.red { background: #e8c0c0; }
    .vote-col-title { font-weight: bold; text-align: center; padding: 5px; font-size: 0.75rem; background: rgba(0,0,0,0.1); border-radius: 10px; margin-bottom: 8px; }
    .attendee-item { padding: 4px 6px; font-size: 0.7rem; border-bottom: 1px solid rgba(0,0,0,0.05); }
    .attendee-num { color: #8a9e6a; font-weight: 600; margin-right: 6px; }
    .no-votes { text-align: center; padding: 10px; font-size: 0.65rem; color: #b0a890; }
    .action-btns { display: flex; gap: 8px; margin-top: 12px; }
    .action-btn { background: #c0b8a0; border: none; border-radius: 30px; padding: 5px 12px; font-size: 0.7rem; cursor: pointer; flex: 1; text-align: center; }
    .action-btn.edit { background: #8aae6a; color: white; }
    .action-btn.delete { background: #c08080; color: white; }
    .edit-form { background: #e8e4d8; border-radius: 14px; padding: 12px; margin-top: 12px; display: none; }
    .edit-form.show { display: block; }
    .edit-form input, .edit-form textarea { width: 100%; padding: 8px; margin-bottom: 8px; border-radius: 12px; border: 1px solid #c0b8a0; }
    .edit-form button { background: #8a9e6a; color: white; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; }
    .change-btn { background: #c0b8a0; border: none; border-radius: 30px; padding: 6px; font-size: 0.7rem; cursor: pointer; width: 100%; margin-top: 12px; }
    .current-vote { text-align: center; font-size: 0.7rem; font-weight: bold; padding: 6px; border-radius: 20px; margin-top: 12px; }
    .current-vote.yes { background: #d0e8c0; color: #4a6a2a; }
    .current-vote.no { background: #e8c0c0; color: #a04040; }
    .event-select { width: 100%; padding: 10px; border-radius: 14px; margin: 10px 0; border: 1px solid #d0c8b0; }
    .add-form { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
    .add-form input, .add-form textarea { padding: 10px; border-radius: 14px; border: 1px solid #d0c8b0; }
    .add-form button { background: #8a9e6a; color: white; border: none; padding: 10px; border-radius: 14px; cursor: pointer; }
    .login-box {
  background: transparent;
  padding: 8px 0;
  margin-top: 16px;
  text-align: center;
  border-top: 1px dashed #d0c8b0;
  opacity: 0.4;
  transition: opacity 0.3s ease;
}
.login-box:hover {
  opacity: 1;
}
.login-box > div {
  color: #b0a890;
  font-size: 0.65rem;
  margin-bottom: 6px;
}
.login-box input {
  padding: 4px 8px;
  width: auto;
  display: inline-block;
  margin: 0 4px;
  font-size: 0.7rem;
  border: 1px solid #d0c8b0;
  border-radius: 16px;
  background: #faf8f0;
}
.login-box input:first-of-type {
  width: 100px;
}
.login-box input:last-of-type {
  width: 100px;
}
.login-box button {
  background: #c0b8a0;
  color: #4a5b3a;
  border: none;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.65rem;
  cursor: pointer;
  display: inline-block;
  margin-top: 0;
}
.login-box button:hover {
  background: #8a9e6a;
  color: white;
}
    .refresh-note { text-align: center; font-size: 0.65rem; color: #8a9e6a; margin-top: 8px; }
    @media (max-width: 500px) { .day-cell { min-height: 70px; } .event-badge { font-size: 0.5rem; white-space: normal; } .vote-buttons { gap: 8px; } .vote-btn { padding: 4px 12px; font-size: 0.7rem; } }   /* Стили для списка событий */
    .event-list-item {
      transition: all 0.2s ease;
    }
    .event-list-item:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>
<div class="container">
  <h1>⚔️ КАЛЕНДАРЬ ИГР</h1>
  <div class="mode-badge" id="modeBadge">🗳️ РЕЖИМ ГОЛОСОВАНИЯ</div>

  <div class="status-bar" id="statusBar">🔄 ПОДКЛЮЧЕНИЕ К FIREBASE...</div>

  <div class="admin-panel" id="adminPanel">
    <button class="admin-toggle" onclick="exitAdminMode()">🔒 ВЫЙТИ ИЗ РЕЖИМА РЕДАКТИРОВАНИЯ</button>
  </div>

  <div class="month-nav">
    <button id="prevMonthBtn">◀</button>
    <span class="current-month" id="currentMonthLabel"></span>
    <button id="nextMonthBtn">▶</button>
  </div>

  <div class="calendar-grid" id="calendarGrid"></div>

  <div class="details-section" id="detailsSection">
    <div style="text-align: center; padding: 20px; color: #b0a890;">👈 НАЖМИТЕ НА ДЕНЬ</div>
  </div>

  <div id="adminForms" style="display: none;">
    <div class="add-form">
      <input type="text" id="newEventName" placeholder="НАЗВАНИЕ ИГРЫ">
      <textarea id="newEventDesc" placeholder="ОПИСАНИЕ"></textarea>
      <input type="text" id="newEventLink" placeholder="ССЫЛКА">
      <button id="addEventBtn">➕ ДОБАВИТЬ СОБЫТИЕ</button>
    </div>
  </div>

  <div id="loginBox" class="login-box">
    <div>🔐 ДОСТУП К РЕЖИМУ РЕДАКТИРОВАНИЯ</div>
    <input type="password" id="adminCode" placeholder="КОД ДОСТУПА">
    <input type="text" id="adminNick" placeholder="ВАШ ПОЗЫВНОЙ">
    <button onclick="checkAdmin()">ВОЙТИ</button>
  </div>

  <div class="refresh-note">🔄 ВСЕ ИЗМЕНЕНИЯ СОХРАНЯЮТСЯ АВТОМАТИЧЕСКИ</div>
  <div class="refresh-note" id="saveIndicator" style="display:none;">💾 Сохранено: <span id="lastSaved">—</span></div>
</div>

<script>
  // ========== ВАШИ НАСТРОЙКИ FIREBASE ==========
  const firebaseConfig = {
    apiKey: "AIzaSyAgS4pyfIEDe5om_dhFeAhTMc9NnxYq_yQ",
    authDomain: "game-calendar-7800a.firebaseapp.com",
    projectId: "game-calendar-7800a",
    storageBucket: "game-calendar-7800a.firebasestorage.app",
    messagingSenderId: "687344707531",
    appId: "1:687344707531:web:03c1fe16598782169a384e"
  };
  // ===============================================

  // Инициализация Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const ADMIN_PASSWORD = "orden.sparta";

  let eventsDB = {};
  let currentYear = 2026, currentMonth = 5;
  let selectedDate = "", selectedEventId = null;
  let isAdmin = false;

  function formatDate(dateStr) {
    let p = dateStr.split('-');
    return `${p[2]}.${p[1]}.${p[0].slice(2)}`;
  }

  function updateStatus(text, isError = false) {
    const statusBar = document.getElementById('statusBar');
    statusBar.innerHTML = text;
    statusBar.style.color = isError ? '#a04040' : '#5a6b4a';
  }

  // ЗАГРУЗКА ДАННЫХ ИЗ FIREBASE
  async function loadFromFirebase() {
    updateStatus("🔄 ЗАГРУЗКА ДАННЫХ...");
    try {
      const snapshot = await db.collection("events").get();
      eventsDB = {};
      snapshot.forEach(doc => {
        const data = doc.data();
        eventsDB[doc.id] = data.events || [];
      });
      updateStatus(`✅ ЗАГРУЖЕНО ${Object.keys(eventsDB).length} ДНЕЙ С СОБЫТИЯМИ`);
      renderCalendar();
      if (selectedDate) showDayEvents(selectedDate);
    } catch (error) {
      console.error("Ошибка загрузки:", error);
      updateStatus("❌ ОШИБКА ПОДКЛЮЧЕНИЯ К FIREBASE. ПРОВЕРЬТЕ НАСТРОЙКИ!", true);
    }
  }

  // СОХРАНЕНИЕ В FIREBASE
  async function saveToFirebase() {
    try {
      const batch = db.batch();
      for (const [date, events] of Object.entries(eventsDB)) {
        const docRef = db.collection("events").doc(date);
        batch.set(docRef, { events: events, updatedAt: new Date() });
      }
      await batch.commit();
      updateStatus("💾 СОХРАНЕНО В ОБЛАКО");
      document.getElementById('saveIndicator').style.display = 'block';
      document.getElementById('lastSaved').textContent = new Date().toLocaleTimeString();
      setTimeout(() => {
        document.getElementById('saveIndicator').style.display = 'none';
      }, 2000);
    } catch (error) {
      console.error("Ошибка сохранения:", error);
      updateStatus("❌ ОШИБКА СОХРАНЕНИЯ", true);
    }
  }

  function getEventsForDate(date) {
    if (!eventsDB[date]) eventsDB[date] = [];
    return eventsDB[date];
  }

  async function addEvent(date, name, desc, link) {
    if (!isAdmin) { alert("ТОЛЬКО АДМИН!"); return false; }
    if (!name.trim()) return false;
    getEventsForDate(date).push({
      id: Date.now(),
      name: name.trim().toUpperCase(),
      description: desc,
      link: link,
      yesVotes: [],
      noVotes: []
    });
    await saveToFirebase();
    renderCalendar();
    showDayEvents(date);
    return true;
  }

  async function editEvent(eventId, date, newName, newDesc, newLink) {
    if (!isAdmin) return;
    const ev = eventsDB[date]?.find(e => e.id === eventId);
    if (ev) {
      ev.name = newName.toUpperCase();
      ev.description = newDesc;
      ev.link = newLink;
    }
    await saveToFirebase();
    showEventDetails(date, eventId);
  }

  async function vote(eventId, date, userName, type) {
    const ev = eventsDB[date]?.find(e => e.id === eventId);
    if (!ev) return;
    const uname = userName.toUpperCase();
    ev.yesVotes = ev.yesVotes.filter(v => v !== uname);
    ev.noVotes = ev.noVotes.filter(v => v !== uname);
    if (type === 'yes') ev.yesVotes.push(uname);
    else if (type === 'no') ev.noVotes.push(uname);
    ev.yesVotes.sort();
    ev.noVotes.sort();
    await saveToFirebase();
    if (selectedEventId === eventId) showEventDetails(date, eventId);
    renderCalendar();
  }

  async function deleteEvent(eventId, date) {
    if (!isAdmin) return;
    eventsDB[date] = eventsDB[date].filter(e => e.id !== eventId);
    if (eventsDB[date].length === 0) delete eventsDB[date];
    if (selectedEventId === eventId) {
      selectedEventId = null;
      selectedDate = "";
    }
    await saveToFirebase();
    renderCalendar();
    if (selectedDate) showDayEvents(selectedDate);
    else document.getElementById('detailsSection').innerHTML = '<div style="text-align:center;padding:20px;color:#b0a890;">👈 НАЖМИТЕ НА ДЕНЬ</div>';
  }

  function renderCalendar() {
    const firstDay = new Date(currentYear, currentMonth, 1);
    let offset = firstDay.getDay() - 1;
    if (offset === -1) offset = 6;
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    const today = new Date().toISOString().split('T')[0];
    const grid = document.getElementById("calendarGrid");

    let html = "<div class='weekday'>ПН</div><div class='weekday'>ВТ</div><div class='weekday'>СР</div><div class='weekday'>ЧТ</div><div class='weekday'>ПТ</div><div class='weekday'>СБ</div><div class='weekday'>ВС</div>";
    for (let i = 0; i < offset; i++) html += `<div class='day-cell' style='background:#e8e4d8;'><div class='empty-day'>—</div></div>`;

    for (let d = 1; d <= daysInMonth; d++) {
      const dateKey = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const events = eventsDB[dateKey] || [];
      const hasEvents = events.length > 0;
      const isWeekend = (new Date(currentYear, currentMonth, d).getDay() === 0 || new Date(currentYear, currentMonth, d).getDay() === 6);
      let bg = hasEvents ? '#e8a0a0' : (isWeekend ? '#d8e8d0' : (dateKey === today ? '#fff4c4' : (dateKey < today ? '#f0ece0' : '#f8f4e8')));
      let border = dateKey === today ? '3px solid #c0a040' : (selectedDate === dateKey ? '3px solid #8a9e6a' : '1px solid #d0c8b0');

      html += `<div class='day-cell ${hasEvents ? 'has-event' : ''}' data-date='${dateKey}' style='background:${bg}; border:${border}; position:relative;'>`;
      html += `<div class='day-number'>${d}</div>`;
      
      if (hasEvents) {
        html += `<div class='viking-icon'>⚔️</div>`;
        // Показываем каждое событие с его личными отметками
        events.forEach(ev => {
          let short = ev.name.length > 18 ? ev.name.substring(0, 16) + '..' : ev.name;
          const yesCount = ev.yesVotes?.length || 0;
          const noCount = ev.noVotes?.length || 0;
          html += `<div class='event-badge' style='display:flex; justify-content:space-between; align-items:center; gap:4px;'>`;
          html += `<span style='white-space:nowrap; overflow:hidden; text-overflow:ellipsis;'>🏷️ ${short}</span>`;
          if (yesCount + noCount > 0) {
            html += `<span style='background:rgba(0,0,0,0.2); border-radius:10px; padding:0px 6px; font-size:0.5rem; flex-shrink:0;'>✅${yesCount} ❌${noCount}</span>`;
          }
          html += `</div>`;
        });
      } else {
        html += `<div class='empty-day'>➕</div>`;
      }
      html += `</div>`;
    }

    const total = offset + daysInMonth;
    const rem = (7 - (total % 7)) % 7;
    for (let i = 0; i < rem; i++) html += `<div class='day-cell' style='background:#e8e4d8;'><div class='empty-day'></div></div>`;

    grid.innerHTML = html;
    const months = ['ЯНВ','ФЕВ','МАР','АПР','МАЙ','ИЮНЬ','ИЮЛЬ','АВГ','СЕН','ОКТ','НОЯ','ДЕК'];
    document.getElementById("currentMonthLabel").innerHTML = `${months[currentMonth]} ${currentYear}`;

    document.querySelectorAll('.day-cell[data-date]').forEach(cell => {
      cell.addEventListener('click', () => {
        selectedDate = cell.dataset.date;
        selectedEventId = null;
        renderCalendar();
        showDayEvents(selectedDate);
      });
    });
  }

  function showDayEvents(date) {
    const events = getEventsForDate(date);
    
    // Если событий нет
    if (!events.length) {
      document.getElementById('detailsSection').innerHTML = `
        <div>
          <div class='event-title'>📅 ${formatDate(date)}</div>
          <div style='color:#8a9e6a;'>НЕТ СОБЫТИЙ</div>
          ${isAdmin ? `<button class='vote-btn' style='width:100%; margin-top:12px;' onclick='document.getElementById("newEventName").focus()'>➕ ДОБАВИТЬ СОБЫТИЕ</button>` : ''}
        </div>`;
      return;
    }
    
    // Показываем список событий
    let eventsListHtml = `
      <div>
        <div class='event-title'>📅 ${formatDate(date)}</div>
        <div style='margin-top: 12px;' id='eventsList'>
    `;
    
    // Сортируем события по имени (опционально)
    const sortedEvents = [...events].sort((a, b) => a.name.localeCompare(b.name));
    
    sortedEvents.forEach(ev => {
      const yesCount = ev.yesVotes?.length || 0;
      const noCount = ev.noVotes?.length || 0;
      
      eventsListHtml += `
        <div class='event-list-item' data-event-id='${ev.id}' style='
          background: #e8e4d8;
          border-radius: 12px;
          padding: 10px 12px;
          margin-bottom: 8px;
          cursor: pointer;
          transition: all 0.2s ease;
          border: 1px solid #d0c8b0;
        ' onmouseover='this.style.background="#e0d8c8"' onmouseout='this.style.background="#e8e4d8"'>
          <div style='display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;'>
            <span style='font-weight: bold; font-size: 0.9rem; color: #4a5b3a;'>⚔️ ${ev.name}</span>
            <span style='background: #8a9e6a; border-radius: 20px; padding: 4px 10px; font-size: 0.7rem; color: white;'>
              ✅ ${yesCount} | ❌ ${noCount}
            </span>
          </div>
        </div>
      `;
    });
    
    eventsListHtml += `
        </div>
        <div id='eventDetail' style='margin-top: 16px;'></div>
      </div>
    `;
    
    document.getElementById('detailsSection').innerHTML = eventsListHtml;
    
        // Добавляем обработчики кликов на каждый элемент списка (открыть/закрыть)
    document.querySelectorAll('.event-list-item').forEach(item => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        const eventId = parseInt(item.dataset.eventId);
        
        // Если это событие уже открыто - закрываем его
        if (selectedEventId === eventId) {
          selectedEventId = null;
          document.getElementById('eventDetail').innerHTML = '';
        } else {
          // Иначе открываем новое событие
          selectedEventId = eventId;
          showEventDetails(date, eventId);
        }
      });
    });
    
    // Если ранее было выбрано событие и оно существует - показываем его
    if (selectedEventId && events.find(e => e.id === selectedEventId)) {
      showEventDetails(date, selectedEventId);
    }
  }

  function showEventDetails(date, eventId) {
    const ev = eventsDB[date]?.find(e => e.id === eventId);
    if (!ev) return;
    const yesList = [...(ev.yesVotes || [])].sort();
    const noList = [...(ev.noVotes || [])].sort();
    const userName = localStorage.getItem('userName') || "";
    const hasYes = yesList.includes(userName);
    const hasNo = noList.includes(userName);

    let adminBtns = '';
    if (isAdmin) {
      adminBtns = `
        <div class='action-btns'>
          <button class='action-btn edit' onclick='toggleEditForm(${ev.id})'>✏️ РЕДАКТИРОВАТЬ</button>
          <button class='action-btn delete' onclick='if(confirm("УДАЛИТЬ?")) deleteEvent(${ev.id},"${date}")'>🗑 УДАЛИТЬ</button>
        </div>
        <div id='editForm-${ev.id}' class='edit-form'>
          <input type='text' id='editName-${ev.id}' value='${ev.name.replace(/"/g, "&quot;")}'>
          <textarea id='editDesc-${ev.id}'>${ev.description || ''}</textarea>
          <input type='text' id='editLink-${ev.id}' value='${ev.link || ''}'>
          <button onclick='saveEdit(${ev.id},"${date}")'>💾 СОХРАНИТЬ</button>
          <button onclick='toggleEditForm(${ev.id})'>❌ ОТМЕНА</button>
        </div>
      `;
    }

    document.getElementById('eventDetail').innerHTML = `
      <div style='border-top: 2px solid #d0c8b0; padding-top: 12px; margin-top: 8px;'>
        <div class='event-title'>⚔️ ${ev.name}</div>
        ${ev.description ? `<div class='event-desc'>📝 ${ev.description}</div>` : ''}
        ${ev.link ? `<div class='event-link'>🔗 <a href='${ev.link}' target='_blank'>ССЫЛКА</a></div>` : ''}
        <div class='vote-buttons'>
          <button class='vote-btn yes ${hasYes ? 'disabled' : ''}' onclick='voteClick(${ev.id},"${date}","yes")'>✅ ИДУ</button>
          <button class='vote-btn no ${hasNo ? 'disabled' : ''}' onclick='voteClick(${ev.id},"${date}","no")'>❌ НЕ ИДУ</button>
        </div>
        <div class='vote-columns'>
          <div class='vote-col green'>
            <div class='vote-col-title'>✅ ИДУ (${yesList.length})</div>
            ${yesList.length ? yesList.map((n,i) => `<div class='attendee-item'><span class='attendee-num'>${i+1}.</span> ${n}</div>`).join('') : '<div class="no-votes">😴 ПОКА НИКТО</div>'}
          </div>
          <div class='vote-col red'>
            <div class='vote-col-title'>❌ НЕ ИДУ (${noList.length})</div>
            ${noList.length ? noList.map((n,i) => `<div class='attendee-item'><span class='attendee-num'>${i+1}.</span> ${n}</div>`).join('') : '<div class="no-votes">😴 ПОКА НИКТО</div>'}
          </div>
        </div>
        ${hasYes || hasNo ? `<div class='current-vote ${hasYes ? "yes" : "no"}'>🗳️ ВЫ ПРОГОЛОСОВАЛИ: ${hasYes ? "✅ ИДУ" : "❌ НЕ ИДУ"}</div>` : ''}
        <button class='change-btn' onclick='changeVote(${ev.id},"${date}")'>🔄 ИЗМЕНИТЬ/ОТМЕНИТЬ</button>
        ${adminBtns}
      </div>
    `;
  }

  window.toggleEditForm = (id) => {
    const form = document.getElementById(`editForm-${id}`);
    if (form) form.classList.toggle('show');
  };

  window.saveEdit = async (id, date) => {
    const newName = document.getElementById(`editName-${id}`).value;
    const newDesc = document.getElementById(`editDesc-${id}`).value;
    const newLink = document.getElementById(`editLink-${id}`).value;
    if (!newName.trim()) { alert("ВВЕДИТЕ НАЗВАНИЕ!"); return; }
    await editEvent(id, date, newName, newDesc, newLink);
    toggleEditForm(id);
  };

  window.voteClick = async (id, date, type) => {
    let name = localStorage.getItem('userName');
    if (!name) {
      name = prompt("ВВЕДИТЕ ВАШ ПОЗЫВНОЙ");
      if (name && name.trim()) {
        localStorage.setItem('userName', name.trim().toUpperCase());
      } else { return; }
    }
    await vote(id, date, name.trim().toUpperCase(), type);
  };

  window.changeVote = async (id, date) => {
    let name = prompt("ВВЕДИТЕ ПОЗЫВНОЙ ДЛЯ ОТМЕНЫ", localStorage.getItem('userName') || "");
    if (name && name.trim()) {
      const uname = name.trim().toUpperCase();
      const ev = eventsDB[date]?.find(e => e.id === id);
      if (ev) {
        ev.yesVotes = ev.yesVotes.filter(v => v !== uname);
        ev.noVotes = ev.noVotes.filter(v => v !== uname);
        await saveToFirebase();
        renderCalendar();
        showEventDetails(date, id);
        alert("ГОЛОС УДАЛЕН!");
      }
    }
  };

  function checkAdmin() {
    const code = document.getElementById('adminCode').value;
    const nickname = document.getElementById('adminNick').value.trim();
    if (!nickname) { alert("ВВЕДИТЕ ПОЗЫВНОЙ!"); return; }
    if (code !== ADMIN_PASSWORD) { alert("❌ НЕВЕРНЫЙ КОД!"); return; }
    isAdmin = true;
    localStorage.setItem('gameCalendarAdmin', 'true');
    document.getElementById('modeBadge').innerHTML = '✏️ РЕЖИМ РЕДАКТИРОВАНИЯ';
    document.getElementById('modeBadge').style.background = '#d0c8b0';
    document.getElementById('adminPanel').classList.add('show');
    document.getElementById('adminForms').style.display = 'block';
    document.getElementById('loginBox').style.display = 'none';
    if (selectedDate) showDayEvents(selectedDate);
    alert(`✅ РЕЖИМ АДМИНИСТРАТОРА ВКЛЮЧЕН!`);
  }

  function exitAdminMode() {
    isAdmin = false;
    localStorage.removeItem('gameCalendarAdmin');
    document.getElementById('modeBadge').innerHTML = '🗳️ РЕЖИМ ГОЛОСОВАНИЯ';
    document.getElementById('modeBadge').style.background = '#e0d8c8';
    document.getElementById('adminPanel').classList.remove('show');
    document.getElementById('adminForms').style.display = 'none';
    document.getElementById('loginBox').style.display = 'block';
    if (selectedDate) showDayEvents(selectedDate);
    loadFromFirebase();
  }

  function checkStoredAdmin() {
    if (localStorage.getItem('gameCalendarAdmin') === 'true') {
      isAdmin = true;
      document.getElementById('modeBadge').innerHTML = '✏️ РЕЖИМ РЕДАКТИРОВАНИЯ';
      document.getElementById('modeBadge').style.background = '#d0c8b0';
      document.getElementById('adminPanel').classList.add('show');
      document.getElementById('adminForms').style.display = 'block';
      document.getElementById('loginBox').style.display = 'none';
    }
  }

  document.getElementById("addEventBtn")?.addEventListener("click", async () => {
    if (!isAdmin) { alert("ТОЛЬКО АДМИН!"); return; }
    if (!selectedDate) { alert("СНАЧАЛА ВЫБЕРИТЕ ДЕНЬ!"); return; }
    const name = document.getElementById("newEventName").value;
    if (!name.trim()) { alert("ВВЕДИТЕ НАЗВАНИЕ!"); return; }
    await addEvent(selectedDate, name, document.getElementById("newEventDesc").value, document.getElementById("newEventLink").value);
    document.getElementById("newEventName").value = "";
    document.getElementById("newEventDesc").value = "";
    document.getElementById("newEventLink").value = "";
  });

  document.getElementById("prevMonthBtn").addEventListener("click", () => {
    currentMonth--;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    selectedDate = "";
    selectedEventId = null;
    renderCalendar();
    document.getElementById('detailsSection').innerHTML = '<div style="text-align:center;padding:20px;color:#b0a890;">👈 НАЖМИТЕ НА ДЕНЬ</div>';
  });

  document.getElementById("nextMonthBtn").addEventListener("click", () => {
    currentMonth++;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    selectedDate = "";
    selectedEventId = null;
    renderCalendar();
    document.getElementById('detailsSection').innerHTML = '<div style="text-align:center;padding:20px;color:#b0a890;">👈 НАЖМИТЕ НА ДЕНЬ</div>';
  });

  async function init() {
    await loadFromFirebase();
    checkStoredAdmin();
  }

  init();
</script>
</body>
</html>
